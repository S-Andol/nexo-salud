<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada — NEXO Salud</title>
  <link rel="icon" href="data:,">
  <!--
    Inline styles on purpose: GitHub Pages serves this file for any unmatched path
    at any depth under /nexo-salud/, and a relative "./styles.css" resolves against
    the browser's current (broken) URL rather than this file's real location, so a
    linked stylesheet can silently 404 depending on how deep the missing path was.
    Keeping this page fully self-contained sidesteps that entirely.
  -->
  <style>
    :root {
      --brand-600: #0f8272;
      --brand-700: #0f685e;
      --ink-600: #555c6d;
      --ink-900: #23262e;
      --background: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--ink-900);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }
    p.eyebrow {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--brand-600);
    }
    h1 {
      margin: 0.75rem 0 0;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p.desc {
      margin: 0.75rem 0 0;
      max-width: 24rem;
      color: var(--ink-600);
    }
    a.btn {
      display: inline-flex;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      background: var(--brand-600);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }
    a.btn:hover {
      background: var(--brand-700);
    }
  </style>
</head>
<body>
  <p class="eyebrow">Error 404</p>
  <h1>Página no encontrada</h1>
  <p class="desc">La página que buscás no existe en esta demo visual de NEXO Salud.</p>
  <a class="btn" href="/nexo-salud/">Volver al inicio</a>
</body>
</html>
